<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favLensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="45%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <radialGradient id="favGlass" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stopColor="#bae6fd" stopOpacity="0.95" />
      <stop offset="35%" stopColor="#38bdf8" stopOpacity="0.8" />
      <stop offset="70%" stopColor="#1d4ed8" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0f172a" stopOpacity="1" />
    </radialGradient>
    <linearGradient id="favReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.85" />
      <stop offset="40%" stopColor="#ffffff" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#090d16" />
  <!-- Outer Housing Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#favLensGrad)" stroke-width="4" />
  <!-- Inner Glass Element -->
  <circle cx="50" cy="50" r="33" fill="url(#favGlass)" stroke="#d4af37" stroke-width="1.5" />
  <!-- Diaphragm Aperture Pattern -->
  <path d="M50 20 L62 38 L46 44 Z" fill="#1e40af" fill-opacity="0.5" />
  <path d="M76 40 L66 56 L52 44 Z" fill="#1e40af" fill-opacity="0.5" />
  <path d="M70 68 L50 70 L52 54 Z" fill="#1d4ed8" fill-opacity="0.45" />
  <path d="M42 78 L30 62 L44 56 Z" fill="#1e3a8a" fill-opacity="0.6" />
  <path d="M24 58 L34 42 L46 52 Z" fill="#2563eb" fill-opacity="0.4" />
  <path d="M30 30 L50 28 L46 46 Z" fill="#3b82f6" fill-opacity="0.35" />
  <!-- Optical Reflection Flare Arc -->
  <ellipse cx="44" cy="40" rx="18" ry="11" transform="rotate(-25 44 40)" fill="url(#favReflection)" />
  <circle cx="60" cy="58" r="2.5" fill="#ffffff" fill-opacity="0.7" />
  <!-- Central Pinpoint Iris -->
  <circle cx="50" cy="50" r="6" fill="#090d16" stroke="#60a5fa" stroke-width="1.5" />
</svg>
